[files]
# typos skips what .gitignore lists (the generated site and bundles); lock
# files are tracked but not worth spell checking
extend-exclude = [
  "*.lock",
  "package-lock.json",
  # Vendored OurAirports rows: IATA codes such as MUC and BRE are not words
  "tests/fixtures/*.csv",
]

[default.extend-words]
# Unicode general category "decimal number", used in Hypothesis strategies
Nd = "Nd"
