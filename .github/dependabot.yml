---
version: 2
updates:
  # Python dependencies: the ranges in pyproject.toml, the single source of
  # the Python dependencies. Dependabot cannot recompile the hashed lock
  # files CI installs, so the lint job fails a bump the locks no longer
  # satisfy; run `make lock` on the branch. The weekly "lock" workflow
  # recompiles them as well.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"
    groups:
      testing:
        patterns:
          - "pytest*"
          - "coverage"
          - "hypothesis"
      linter:
        patterns:
          - "ruff"
          - "mypy"
          - "bandit"
      core:
        patterns:
          - "lxml"
      minifiers:
        patterns:
          - "rcssmin"
          - "rjsmin"
          - "minify-html"

  # JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "npm"
      include: "scope"
    ignore:
      # typescript-eslint does not support the next TypeScript major yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # A dependency joins the first group it matches, so the named groups come
    # before the catch-all for the remaining minor and patch updates
    groups:
      # On its own because it cannot be merged as it comes: the visual job
      # runs in the Playwright image, whose tag and digest in test.yml (and
      # the same reference in CONTRIBUTING.md and DEVELOPMENT.md) have to
      # be bumped by hand on the same branch. scripts/check_locks.py fails
      # the lint job until they are; the visual job comment in test.yml
      # says how to look up the digest.
      playwright:
        patterns:
          - "@playwright/test"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
      build-tools:
        patterns:
          - "esbuild"
          - "eslint*"
          - "@eslint/*"
          - "prettier"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Docker base images: covers Dockerfile in the root directory. It carries a
  # tag and a digest, which Dependabot bumps together. The container job
  # builds and runs the image on every pull request, so a bump that breaks
  # it turns red.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    ignore:
      # The Python and Node.js versions follow .python-version and .nvmrc,
      # which CI uses and Dependabot does not bump; move all of them together
      # by hand. Digest updates of the current tags still come through.
      - dependency-name: "library/python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "library/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # pre-commit hook revisions. Only the two pinned repos are left in
  # .pre-commit-config.yaml; the linters and formatters run from the project
  # environment, so nothing here can drift from what CI installs. The CI
  # security job reads the gitleaks release the hook pins, so its bump moves
  # CI along.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "pre-commit"
    groups:
      hooks:
        patterns:
          - "*"
