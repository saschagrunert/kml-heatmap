---
version: 2
updates:
  # Python dependencies: the ranges in pyproject.toml, the single source of
  # the Python dependencies. The hashed lock files compiled from it are
  # regenerated by the weekly "lock" workflow, and CI installs the lock
  # files, so a bump here is exercised by the next lock run.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"
    groups:
      testing:
        patterns:
          - "pytest*"
          - "coverage"
          - "hypothesis"
      linter:
        patterns:
          - "ruff"
          - "mypy"
          - "bandit"
      core:
        patterns:
          - "lxml"
      minifiers:
        patterns:
          - "rcssmin"
          - "rjsmin"
          - "minify-html"

  # JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "npm"
      include: "scope"
    ignore:
      # typescript-eslint does not support the next TypeScript major yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The e2e tests serve these from node_modules in place of the CDN
      # copies the page loads, so they have to stay at the versions pinned
      # (with integrity hashes) in the HTML template
      - dependency-name: "leaflet"
      - dependency-name: "leaflet.heat"
      - dependency-name: "dom-to-image"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "typescript"
          - "typescript-eslint"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      build-tools:
        patterns:
          - "esbuild"
          - "eslint*"
          - "@eslint/*"
          - "prettier"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Docker base images: covers Dockerfile in the root directory. It carries a
  # tag and a digest, which Dependabot bumps together. The container job
  # builds the image on every pull request, so a bump that breaks it turns
  # red.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
