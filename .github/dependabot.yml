---
version: 2
updates:
  # Python dependencies: the ranges in pyproject.toml, the single source of
  # the Python dependencies, and the pip-tools pin in requirements-tools.in.
  # Dependabot does not read the *.lock files and cannot recompile them, so
  # the lint job fails a bump the locks no longer satisfy; run `make lock` on
  # the branch. The weekly "lock" workflow recompiles them as well.
  #
  # Until then such a pull request tests nothing new: every job installs the
  # old lock files. The test workflow therefore runs only its cheap jobs
  # for Dependabot's own pushes to a dependabot/pip/ branch, and everything
  # once `make lock` is pushed on top.
  - package-ecosystem: "pip"
    directory: "/"
    # Such a pull request gets a commit of its own (`make lock`) to test
    # the new versions, which the lint job also needs where the lock files
    # no longer satisfy the range; Dependabot stops rebasing it after that
    # anyway. Before that a rebase for every push to main only starts
    # another run of the cheap jobs against the old versions; comment
    # `@dependabot rebase` when one is wanted.
    rebase-strategy: disabled
    # Raise the lower bound of a range to the new release. pyproject.toml
    # names a package, so the default ("auto") widens ranges instead, and a
    # ">=" range already admits every new release: from April to September
    # 2026 every run ended in "No update possible" and opened nothing.
    versioning-strategy: increase
    # A release has to be out this long before Dependabot proposes it, so a
    # compromised or broken one is usually yanked before it reaches a pull
    # request. Security updates are not held back. Every ecosystem below
    # waits the same week: that is what zizmor's dependabot-cooldown audit
    # asks for at least, and nothing here needs a release sooner.
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"
    groups:
      testing:
        patterns:
          - "pytest*"
          - "coverage"
          - "hypothesis"
      linter:
        patterns:
          - "ruff"
          - "mypy"
          - "bandit"
      core:
        patterns:
          - "lxml"
      minifiers:
        patterns:
          - "rcssmin"
          - "rjsmin"
          - "minify-html"

  # JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    # See the cooldown of the pip entry
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "npm"
      include: "scope"
    ignore:
      # typescript-eslint does not support the next TypeScript major yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # A dependency joins the first group it matches, so the named groups come
    # before the catch-all for the remaining minor and patch updates
    groups:
      # On its own because it cannot be merged as it comes: the visual and
      # e2e jobs run in the Playwright image, whose tag and digest in
      # test.yml (and the same reference in CONTRIBUTING.md and
      # DEVELOPMENT.md) have to be bumped by hand on the same branch.
      # scripts/check_locks.py fails the lint job until they are; the
      # visual job comment in test.yml says how to look up the digest.
      playwright:
        patterns:
          - "@playwright/test"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
      build-tools:
        patterns:
          - "esbuild"
          - "eslint*"
          - "@eslint/*"
          - "prettier"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      # The style specification validates the app's layers in a unit test
      # (the map itself does not, see withoutValidation in mapHelpers.ts),
      # so it moves with the MapLibre release that depends on it
      maplibre:
        patterns:
          - "maplibre-gl"
          - "@maplibre/maplibre-gl-style-spec"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    # See the cooldown of the pip entry
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Docker base images: covers Dockerfile in the root directory. It carries a
  # tag and a digest, which Dependabot bumps together. The container job
  # builds and runs the image on every pull request, so a bump that breaks
  # it turns red.
  - package-ecosystem: "docker"
    directory: "/"
    # See the cooldown of the pip entry
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    ignore:
      # The Python and Node.js versions follow .python-version and .nvmrc,
      # which CI uses and Dependabot does not bump; move all of them together
      # by hand. Digest updates of the current tags still come through.
      - dependency-name: "library/python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "library/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # pre-commit hook revisions. Only the two pinned repos are left in
  # .pre-commit-config.yaml; the linters and formatters run from the project
  # environment, so nothing here can drift from what CI installs. The CI
  # security job runs the gitleaks image test.yml pins by digest and checks
  # that it is the release the hook pins, so a bump of the gitleaks rev fails
  # that job until the digest is updated by hand on the same branch (the
  # comment of that step says how to look it up).
  - package-ecosystem: "pre-commit"
    directory: "/"
    # See the cooldown of the pip entry
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "pre-commit"
    groups:
      hooks:
        patterns:
          - "*"
