---
version: 2
updates:
  # Python dependencies (requirements.txt / pyproject.toml ranges).
  # The hashed lock files are regenerated by the weekly "lock" workflow.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "pip"
      include: "scope"
    groups:
      testing:
        patterns:
          - "pytest*"
          - "coverage"
          - "hypothesis"
      linter:
        patterns:
          - "ruff"
          - "mypy"
          - "bandit"
      core:
        patterns:
          - "lxml"
      minifiers:
        patterns:
          - "rcssmin"
          - "rjsmin"
          - "minify-html"

  # JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "npm"
      include: "scope"
    ignore:
      # typescript-eslint does not support the next TypeScript major yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "typescript"
          - "typescript-eslint"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      build-tools:
        patterns:
          - "esbuild"
          - "eslint*"
          - "@eslint/*"
          - "prettier"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Docker base images: covers Dockerfile and Dockerfile.test in the root
  # directory (digest pins are bumped together with the tag comment)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
