---
# Tests every pull request and push to main. A push to main (or a manual run
# on main) also builds the site and publishes it to GitHub Pages, but only
# once every test job has passed. The weekly run only repeats the security
# job, so a new advisory for a pinned dependency or a leaked secret shows up
# without a push.
#
# A pull request Dependabot opens for a Python dependency changes only the
# range in pyproject.toml, and every job installs the lock files, which it
# cannot recompile (see dependabot.yml). Until `make lock` is pushed on top
# every job tests the versions of the old lock files. The lint job fails
# only when they no longer satisfy the new range (a lock that pins a
# release in it already passes, as the setuptools bump of ab4db1f did),
# and the unit job would fail with it, on the lock check of
# test_check_locks.py. The jobs that build and drive the site (unit and the
# visual job after it, packaging, e2e-sites and the e2e jobs after it,
# container) therefore skip Dependabot's own pushes to its pull requests
# from a dependabot/pip/ branch. `github.actor` is whoever pushed (a re-run
# keeps it), so the push of the lock files runs all of them. zizmor calls
# the actor spoofable: here it can only skip jobs, and only in a pull
# request Dependabot opened (its author cannot be spoofed), whose lint job
# still checks the lock files against the range.
#
# A bump of @playwright/test (the `playwright` group, branches starting with
# dependabot/npm_and_yarn/playwright) is the same case for the jobs that run
# in the Playwright image, e2e and visual: its tag and digest are bumped by
# hand on the branch (see the visual job), and until then every one of them
# failed at once against the old image. They skip Dependabot's own pushes
# there, and the lint job fails until the image reference is pushed.
name: test
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Runs on main are not cancelled once they started. Of the pushes waiting
  # behind a running one only the newest is kept, so the newest commit is
  # always tested and deployed. The weekly run gets its own group so it can
  # never replace a push that is waiting to deploy.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # requirements-test.lock pins the runtime dependencies as well, to the
      # same versions (scripts/check_locks.py checks that)
      - name: Install dependencies
        id: deps
        run: |
          pip install --require-hashes -r requirements-test.lock
          npm ci
      # Every check below runs even when an earlier one failed, so a single
      # run reports all of them
      - name: Check that the lock files match pyproject.toml
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python scripts/check_locks.py
      - name: Check Python formatting
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ruff format --check .
      - name: Check Prettier formatting
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run format:check
      - name: Run ruff
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ruff check .
      - name: Run mypy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mypy .
      - name: Type-check the frontend and the build scripts
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck
      - name: Type-check the unit and e2e tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck:tests
      - name: Run eslint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint
      # Files, exports and dependencies nothing reaches any more. The two
      # bundles have size budgets, so dead code is not free here.
      - name: Check for unused files, exports and dependencies
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint:unused

  unit:
    # Not for Dependabot's Python bumps, see the top (also for the zizmor
    # finding this ignores)
    if: >- # zizmor: ignore[bot-conditions]
      github.event_name != 'schedule' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/pip/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements-test.lock
      - name: Install npm dependencies
        run: npm ci
      - name: Build the JavaScript bundle
        run: npm run build
      - name: Compute the weekly cache key
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # Only the CSV: a failed download leaves a marker file behind that
      # suppresses retries for an hour, and a cache saved with it would hand
      # that to every job restoring it. During an outage the build falls back
      # to an earlier week's copy.
      - name: Cache the OurAirports database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kml-heatmap/airports.csv
          key: airports-${{ steps.week.outputs.week }}
          restore-keys: airports-
      # The elevation tiles the ground under the flights is sampled from
      # (kml_heatmap/terrain.py), with the decoded pixels of each beside it
      # (.pixels): about 90 MB for data/, half of it each. A tile never
      # changes upstream, so the cache of the last set of flights is restored
      # for the next and only the tiles of new flights are downloaded; it is
      # saved again under the new set. A tile that failed to download is
      # simply not in it, so no failure is carried over. The pixels carry the
      # CRC of their tile and a version of their layout, and a file that does
      # not match either is decoded again, so they need no key of their own.
      - name: Cache the elevation tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kml-heatmap/terrain
          key: terrain-${{ hashFiles('data/*.kml') }}
          restore-keys: terrain-
      # The export contract test reads the data files of a real build
      - name: Build the site from the current sources
        run: python -m kml_heatmap data --output-dir docs
        env:
          KML_HEATMAP_REQUIRE_AIRPORT_DB: "1"
      # The visual job compares this site inside the Playwright image, where
      # the package's own Python is not available (actions/setup-python
      # installs one there that cannot start: its scripts point at the tool
      # cache path of the runner, which the container mounts elsewhere). The
      # script keeps the build offline and its build stamp fixed.
      - name: Build the fixture site of the visual snapshots
        run: python scripts/build_visual_site.py
      - name: Upload the fixture site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-site
          path: visual-site
          if-no-files-found: error
          retention-days: 1
      - name: Run JavaScript tests with coverage
        run: npm run test:coverage
      # Also enforces fail_under from pyproject.toml. A bare --cov measures
      # the sources [tool.coverage.run] names, the scripts among them.
      - name: Run Python tests with coverage
        run: pytest -n auto --cov --cov-branch --cov-report=xml:coverage/coverage.xml --cov-report=term
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.xml,./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

  packaging:
    # Not for Dependabot's Python bumps, see the top (also for the zizmor
    # finding this ignores)
    if: >- # zizmor: ignore[bot-conditions]
      github.event_name != 'schedule' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/pip/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails when the minified bundle exceeds the size budget in build.js
      - name: Build the JavaScript bundle
        run: npm ci && npm run build
      # Without build isolation pip would fetch whatever setuptools satisfies
      # build-system.requires at the time; requirements-build.lock pins it
      # with its hashes like every other Python dependency
      - name: Build the wheel
        run: |
          pip install --require-hashes -r requirements-build.lock
          pip wheel . --no-deps --no-build-isolation -w dist
      # The runtime dependencies from the lock file with their hashes, then
      # the wheel on top without resolving anything again
      - name: Install the wheel into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --disable-pip-version-check --require-hashes -r requirements.lock
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --disable-pip-version-check --no-deps dist/*.whl
      - name: Check the shipped assets
        # Run outside the checkout so the installed package is imported, not the source tree
        working-directory: ${{ runner.temp }}
        run: |
          for asset in templates/map_template.html static/mapApp.bundle.js \
            static/features.bundle.js static/wrapped.bundle.js \
            static/shared.bundle.js static/yearWorker.bundle.js \
            static/vendor/maplibre-gl.mjs static/vendor/maplibre-gl-worker.mjs \
            static/styles.css static/features.css static/wrapped.css; do
            result=$("$RUNNER_TEMP/wheel-venv/bin/python" -c "import importlib.resources as r, kml_heatmap; print(r.files(kml_heatmap).joinpath('$asset').is_file())")
            echo "$asset shipped: $result"
            test "$result" = "True"
          done
          # The bundle is the shipped artifact; its source map (mappings and
          # file names, build.js keeps the sources out) stays with the site
          # and the container and out of the wheel
          maps=$("$RUNNER_TEMP/wheel-venv/bin/python" -c "import importlib.resources as r, kml_heatmap; print(any(p.name.endswith('.map') for p in r.files(kml_heatmap).joinpath('static').iterdir()))")
          echo "source maps shipped: $maps"
          test "$maps" = "False"
      # Loads the parser, the minifiers, the renderer and the templates, which
      # `--version` alone never imports. The airport fixture stands in for
      # the OurAirports download, and `--no-terrain` keeps the elevation
      # tiles from being fetched on every run: the sampling has tests of
      # its own, and the image below builds without a network.
      - name: Generate a site with the installed package
        working-directory: ${{ runner.temp }}
        env:
          KML_HEATMAP_CACHE_DIR: ${{ runner.temp }}/smoke/cache
        run: |
          mkdir -p smoke/input smoke/cache
          cp "$GITHUB_WORKSPACE/tests/fixtures/airports.csv" smoke/cache/
          kml=("$GITHUB_WORKSPACE"/data/*.kml)
          cp "${kml[@]:0:3}" smoke/input/
          "$RUNNER_TEMP/wheel-venv/bin/kml-heatmap" --version
          "$RUNNER_TEMP/wheel-venv/bin/kml-heatmap" --no-terrain smoke/input --output-dir smoke/site
          for file in index.html map_config.js mapApp.bundle.js \
            features.bundle.js wrapped.bundle.js shared.bundle.js \
            yearWorker.bundle.js styles.css features.css wrapped.css \
            vendor/maplibre-gl.mjs vendor/maplibre-gl-worker.mjs data/metadata.json; do
            test -s "smoke/site/$file" || { echo "::error::smoke/site/$file was not generated"; exit 1; }
          done
          # Still the fixture, so nothing was downloaded
          cmp "$GITHUB_WORKSPACE/tests/fixtures/airports.csv" smoke/cache/airports.csv

  # The sites the e2e jobs test, built once for all of them. The published
  # site has a tile API key and a default build has none, so there are two:
  # one with a dummy key and one without (see the e2e job).
  e2e-sites:
    # Not for Dependabot's Python bumps, see the top (also for the zizmor
    # finding this ignores)
    if: >- # zizmor: ignore[bot-conditions]
      github.event_name != 'schedule' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/pip/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Install npm dependencies
        run: npm ci
      - name: Build the JavaScript bundle
        run: npm run build
      - name: Compute the weekly cache key
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the OurAirports database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kml-heatmap/airports.csv
          key: airports-${{ steps.week.outputs.week }}
          restore-keys: airports-
      # The elevation tiles, see the unit job
      - name: Cache the elevation tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kml-heatmap/terrain
          key: terrain-${{ hashFiles('data/*.kml') }}
          restore-keys: terrain-
      # tests/e2e/fixtures.ts answers the tile servers locally, so the dummy
      # key never leaves the runner
      - name: Build the site with a dummy tile API key
        run: python -m kml_heatmap data --output-dir e2e-sites/dummy
        env:
          KML_HEATMAP_REQUIRE_AIRPORT_DB: "1"
          CARTO_API_KEY: e2e-carto
      - name: Build the site without a tile API key
        run: python -m kml_heatmap data --output-dir e2e-sites/none
        env:
          KML_HEATMAP_REQUIRE_AIRPORT_DB: "1"
          CARTO_API_KEY: ""
      - name: Upload the site with a dummy tile API key
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-site-dummy
          path: e2e-sites/dummy
          if-no-files-found: error
          retention-days: 1
      - name: Upload the site without a tile API key
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-site-none
          path: e2e-sites/none
          if-no-files-found: error
          retention-days: 1

  # Runs in the Playwright image the visual job uses (see there for how it is
  # pinned and bumped), so the browsers and the libraries they draw with are
  # the same on every run and the same as a local run in that image, and no
  # job downloads browsers or installs system packages. WebGL is software
  # rendered there, as it was on the bare runner.
  e2e:
    name: e2e (${{ matrix.name }})
    needs: e2e-sites
    # Not for Dependabot's Playwright bumps, see the top
    if: >- # zizmor: ignore[bot-conditions]
      github.event_name != 'schedule' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/playwright'))
    runs-on: ubuntu-latest
    # The relief tests allow three minutes each (orientation.spec.ts), so
    # their jobs get longer
    timeout-minutes: ${{ matrix.timeout-minutes || 15 }}
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Docker caps /dev/shm at 64 MB, which a browser per core outgrows
      options: --ipc=host
    strategy:
      fail-fast: false
      # Every project runs against the published setup, with the dummy key.
      # Without a key only the requests for the base map change, so that
      # variant runs just the specs that make and check those requests
      # (no-key-specs), on the desktop, instead of the whole suite a second
      # time. It rides along in the desktop relief job, after the relief
      # tests, rather than paying for a runner and its setup of its own.
      #
      # Software WebGL runs one browser per core of the 4-vCPU runner. The
      # desktop project is split into three shards and the mobile project
      # into two, on runners of their own; with two, the second desktop
      # shard took 6 to 6.5 minutes against 5 of the first. The relief of
      # the 3D view ("on the relief" in orientation.spec.ts) takes seconds
      # per frame there and failed most often while other browsers shared
      # the cores, in Chromium and in WebKit alike, so in both engines it
      # runs alone: its tests run one after the other in one worker, which
      # then has the whole runner. A renamed describe leaves those jobs with
      # no tests, which fails them.
      matrix:
        include:
          - name: desktop-1
            project: desktop
            shard: 1/3
            grep-invert: on the relief
          - name: desktop-2
            project: desktop
            shard: 2/3
            grep-invert: on the relief
          - name: desktop-3
            project: desktop
            shard: 3/3
            grep-invert: on the relief
          - name: desktop-relief+no-key
            project: desktop
            grep: on the relief
            no-key-specs: base-style.spec.ts error-free.spec.ts layers.spec.ts
            timeout-minutes: 25
          - name: mobile-1
            project: mobile
            shard: 1/2
          - name: mobile-2
            project: mobile
            shard: 2/2
          # The phone interface in Safari's engine
          - name: webkit
            project: webkit
          # Turning, the globe, the replay and the error-free interactions
          # in Safari's engine
          - name: webkit-desktop
            project: webkit-desktop
            grep-invert: on the relief
          - name: webkit-relief
            project: webkit-desktop
            grep: on the relief
            timeout-minutes: 20
            # WebKit's own output in the job log: its page crashed once in
            # the sloped relief test without a page or console error, after
            # blocking the main thread for 30 s
            debug: pw:browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      # After the checkout, so tests/e2e/site-check.ts finds the site newer
      # than the sources; its bundles carry the hash of the sources they
      # were built from, which the check compares with this checkout
      - name: Download the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-site-dummy
          path: docs
      - name: Run the E2E tests
        shell: bash
        env:
          # Checked against docs/map_config.js by tests/e2e/site-check.ts
          E2E_API_KEYS: dummy
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          GREP: ${{ matrix.grep }}
          GREP_INVERT: ${{ matrix.grep-invert }}
          DEBUG: ${{ matrix.debug }}
        run: |
          args=(--project="$PROJECT")
          if [ -n "$SHARD" ]; then args+=(--shard="$SHARD"); fi
          if [ -n "$GREP" ]; then args+=(--grep="$GREP"); fi
          if [ -n "$GREP_INVERT" ]; then args+=(--grep-invert="$GREP_INVERT"); fi
          npx playwright test "${args[@]}"
      # Also when the run above failed, so one run reports both. The site
      # replaces docs/, where the test server looks; the results and the
      # report go next to the ones above, which a second run would delete.
      - name: Download the site without a tile API key
        if: ${{ !cancelled() && matrix.no-key-specs }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-site-none
          path: e2e-site-none
      - name: Run the E2E tests without a tile API key
        if: ${{ !cancelled() && matrix.no-key-specs }}
        shell: bash
        env:
          E2E_API_KEYS: none
          PROJECT: ${{ matrix.project }}
          SPECS: ${{ matrix.no-key-specs }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-no-key
        run: |
          rm -rf docs
          mv e2e-site-none docs
          # SPECS is a list of file names, split into words on purpose
          # shellcheck disable=SC2086
          npx playwright test --project="$PROJECT" --output=test-results-no-key $SPECS
      # Also when the job timed out or was cancelled: the traces of the tests
      # that failed until then are what shows why
      - name: Upload Playwright results
        if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/
            test-results-no-key/
            playwright-report-no-key/
          if-no-files-found: ignore
          retention-days: 7

  # Pixel comparisons are only meaningful where the rendering is fixed, so
  # this one runs inside the Playwright image, which is also what the
  # snapshots were generated in (see CONTRIBUTING.md). The snapshots allow no
  # differing pixel, so the site is not the one of data/, whose figures move
  # with every flight, but the fixture site of scripts/build_visual_site.py:
  # a few committed flights, the airport fixture in place of the OurAirports
  # download and a fixed build stamp. The unit job builds it, since the
  # package needs a Python the image does not carry.
  #
  # The image tag has to match the
  # @playwright/test version package-lock.json pins; scripts/check_locks.py
  # fails the lint job when the two drift apart. Dependabot does not bump
  # the image: with every @playwright/test bump set the new tag here and in
  # the e2e job, with the digest of its multi-arch index (the
  # Docker-Content-Digest header of
  # https://mcr.microsoft.com/v2/playwright/manifests/<tag>), and the same
  # reference in CONTRIBUTING.md and DEVELOPMENT.md (check_locks.py checks
  # all of them). A digest left behind keeps pulling the old image,
  # whatever the tag next to it says.
  visual:
    needs: unit
    # Not for Dependabot's Playwright bumps, see the top
    if: >- # zizmor: ignore[bot-conditions]
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/playwright'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      # The bundles come with it, so tests/e2e/site-check.ts can check them
      # against the sources in this checkout
      - name: Download the fixture site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-site
          path: visual-site
      - name: Compare the page against the committed snapshots
        run: npx playwright test --project=visual
      # The report carries the expected, actual and diff images side by side
      - name: Upload the visual diff
        if: ${{ !success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole commit history
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements-test.lock
      - name: Run bandit
        run: bandit -r kml_heatmap -ll
      # pip-audit is pinned in requirements-test.lock like every other tool.
      # Every lock file, also the ones only the packaging job and `make lock`
      # install. pip-audit resolves the files of one call together, and only
      # the runtime and test locks are compiled to agree, so the build and
      # tools locks get calls of their own.
      - name: Audit the Python lock files
        run: |
          pip-audit --no-deps -r requirements.lock -r requirements-test.lock
          pip-audit --no-deps -r requirements-build.lock
          pip-audit --no-deps -r requirements-tools.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      # The same gitleaks release as the pre-commit hook, whose rev Dependabot
      # bumps, pulled by digest like every other image and action here. The
      # digest is the multi-arch index of the tag; a bump of the hook rev has
      # to update it by hand (`docker manifest inspect -v` or the registry's
      # Docker-Content-Digest header), and the step fails until it does. The
      # config's [[allowlists]] needs gitleaks 8.25 or newer.
      - name: Scan the commit history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        run: |
          version=$(awk '$3 == "https://github.com/gitleaks/gitleaks" { found = 1; next } found && $1 == "rev:" { print $2; exit }' .pre-commit-config.yaml)
          test -n "$version" || { echo "::error::no gitleaks rev in .pre-commit-config.yaml"; exit 1; }
          pulled=$(docker run --rm "$GITLEAKS_IMAGE" version)
          test "${pulled#v}" = "${version#v}" || {
            echo "::error::the pinned gitleaks image is $pulled, the pre-commit hook $version; update the digest in test.yml"
            exit 1
          }
          docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" \
            git --redact --verbose --config /repo/.gitleaks.toml /repo

  container:
    # Not for Dependabot's Python bumps, see the top (also for the zizmor
    # finding this ignores)
    if: >- # zizmor: ignore[bot-conditions]
      github.event_name != 'schedule' &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/pip/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image itself is not published
      - name: Build the container image
        run: docker build -t kml-heatmap .
      # Runs the image the way the Makefile does, with the airport fixture in
      # place of the OurAirports download. Without a network the elevation
      # tiles cannot be fetched either, which the build has to get through
      # with the ground left out.
      - name: Generate a site with the image
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/input" "$smoke/site" "$smoke/cache"
          cp tests/fixtures/airports.csv "$smoke/cache/"
          kml=(data/*.kml)
          cp "${kml[@]:0:3}" "$smoke/input/"
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$smoke/input:/data/input" -v "$smoke/site:/data/site" -v "$smoke/cache:/cache" \
            kml-heatmap input --output-dir site
          for file in index.html map_config.js mapApp.bundle.js \
            features.bundle.js wrapped.bundle.js shared.bundle.js \
            yearWorker.bundle.js styles.css features.css wrapped.css \
            vendor/maplibre-gl.mjs vendor/maplibre-gl-worker.mjs data/metadata.json; do
            test -s "$smoke/site/$file" || { echo "::error::$file was not generated"; exit 1; }
          done
          # Still the fixture, and without a network nothing else was fetched
          cmp tests/fixtures/airports.csv "$smoke/cache/airports.csv"
      # The same run as the image's own user (USER app, no home directory),
      # which the --user flag above bypasses. The mounts are world-writable
      # because that user exists only inside the image.
      - name: Generate a site as the image user
        run: |
          smoke="$RUNNER_TEMP/smoke-app"
          mkdir -p "$smoke/input" "$smoke/site" "$smoke/cache"
          cp tests/fixtures/airports.csv "$smoke/cache/"
          kml=(data/*.kml)
          cp "${kml[@]:0:3}" "$smoke/input/"
          chmod -R a+rwX "$smoke"
          docker run --rm --network none \
            -v "$smoke/input:/data/input" -v "$smoke/site:/data/site" -v "$smoke/cache:/cache" \
            kml-heatmap input --output-dir site
          for file in index.html map_config.js mapApp.bundle.js \
            features.bundle.js wrapped.bundle.js shared.bundle.js \
            yearWorker.bundle.js styles.css features.css wrapped.css \
            vendor/maplibre-gl.mjs vendor/maplibre-gl-worker.mjs data/metadata.json; do
            test -s "$smoke/site/$file" || { echo "::error::$file was not generated as the image user"; exit 1; }
          done

  obfuscation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Check that the KML files are obfuscated
        run: python -m kml_heatmap.obfuscate data/ --check
      # Copies of flights from data/, and as public as they are
      - name: Check that the fixture flights of the visual snapshots are obfuscated
        run: python -m kml_heatmap.obfuscate tests/fixtures/visual/ --check

  typos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2

  # Publishing waits for every test job. The security job is not a gate: a
  # new advisory for a test dependency must not hold back new flights, and
  # the weekly run reports it anyway.
  publishable:
    needs:
      - lint
      - unit
      - packaging
      - e2e-sites
      - e2e
      - visual
      - container
      - obfuscation
      - typos
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.head.outputs.publish }}
    steps:
      # A re-run of an older run keeps its commit; publishing that would
      # replace the site of a newer push
      - name: Check that the commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved on to $head; not publishing $GITHUB_SHA"
          fi

  # Builds the published site from the sources and the KML files in data/.
  # Nothing generated is committed, so every deployment is exactly what the
  # tested commit produces. Only this job sees the real tile API key.
  site:
    needs: publishable
    if: needs.publishable.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Install npm dependencies
        run: npm ci
      - name: Build the JavaScript bundle
        run: npm run build
      - name: Compute the weekly cache key
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Cache the OurAirports database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kml-heatmap/airports.csv
          key: airports-${{ steps.week.outputs.week }}
          restore-keys: airports-
      # The elevation tiles, see the unit job
      - name: Cache the elevation tiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kml-heatmap/terrain
          key: terrain-${{ hashFiles('data/*.kml') }}
          restore-keys: terrain-
      # The deployed site must not lose the ground of a flight to a failed
      # tile download: the build fails instead of publishing without it.
      # GitHub Pages derives the ETags from the modification times, which
      # upload-pages-artifact keeps in its tar; taken from the content, they
      # keep the browser caches of the files a deploy did not change.
      - name: Build the site
        run: python -m kml_heatmap data --output-dir site
        env:
          KML_HEATMAP_REQUIRE_AIRPORT_DB: "1"
          KML_HEATMAP_REQUIRE_TERRAIN: "1"
          KML_HEATMAP_STABLE_MTIMES: "1"
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deployments never overlap and are never cancelled half way
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the Pages site configuration. The Pages source has to be set to
      # "GitHub Actions" by hand (see CONTRIBUTING.md): enabling or switching
      # it needs a token with more rights than GITHUB_TOKEN.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
