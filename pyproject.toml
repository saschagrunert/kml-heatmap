[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kml-heatmap"
dynamic = ["version"]
description = "Interactive heatmap visualizations from KML flight data"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "rcssmin>=1.2.2",
    "rjsmin>=1.2.5",
    "minify-html>=0.18.1",
    "lxml>=6.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "coverage[toml]>=7.13.1",
    "lxml-stubs>=0.5.1",
]
dev = [
    "ruff>=0.16.4",
    "mypy>=1.20.1",
]

[project.urls]
Homepage = "https://github.com/saschagrunert/kml-heatmap"
Repository = "https://github.com/saschagrunert/kml-heatmap"

[tool.setuptools.dynamic]
version = {attr = "kml_heatmap.__version__"}

[project.scripts]
kml-heatmap = "kml_heatmap.cli:main"

[tool.setuptools.packages.find]
include = ["kml_heatmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--cov=kml_heatmap",
    "--cov-report=term-missing",
    "--cov-branch",
    "-n", "auto",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
mypy_path = "stubs"
exclude = [
    "^serve\\.py$",
    "^scripts/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "I", "PLR"]
ignore = [
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]
