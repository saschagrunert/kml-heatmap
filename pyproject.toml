[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kml-heatmap"
dynamic = ["version"]
description = "Interactive heatmap visualizations from KML flight data"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "rcssmin>=1.2.2",
    "rjsmin>=1.2.5",
    "minify-html>=0.18.1",
    "lxml>=6.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "coverage[toml]>=7.13.1",
    "hypothesis>=6.140.0",
    "bandit>=1.9.4",
    "lxml-stubs>=0.5.1",
]
dev = [
    "ruff>=0.16.4",
    "mypy>=1.20.1",
]

[project.urls]
Homepage = "https://github.com/saschagrunert/kml-heatmap"
Repository = "https://github.com/saschagrunert/kml-heatmap"

[tool.setuptools.dynamic]
version = {attr = "kml_heatmap.__version__"}

[project.scripts]
kml-heatmap = "kml_heatmap.cli:main"

[tool.setuptools.packages.find]
include = ["kml_heatmap*"]

[tool.setuptools.package-data]
kml_heatmap = [
    "templates/*",
    "static/*.js",
    "static/*.css",
    "static/*.png",
    "static/*.svg",
    "static/*.ico",
    "static/*.json",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: Slow running tests",
]

[tool.coverage.run]
branch = true
source = ["kml_heatmap"]

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
mypy_path = "stubs"
exclude = [
    "^serve\\.py$",
    "^scripts/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
check_untyped_defs = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W", "UP", "B", "SIM", "I", "PLR", "S", "PT", "RUF",
    "C4", "PERF", "ISC", "PIE", "TC", "RET", "ERA", "N",
]
ignore = [
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PT006",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S314"]
"scripts/**" = ["S311"]
