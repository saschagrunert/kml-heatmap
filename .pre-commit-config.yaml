---
# Install with: pip install pre-commit && pre-commit install
# Input data (data/) is excluded from the fixers; the generated site (docs/)
# is not tracked at all. Dependabot bumps the revs below.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^data/
      - id: trailing-whitespace
        exclude: ^data/
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version in requirements-test.lock
    # (scripts/check_locks.py fails when the two differ)
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    # Keep in sync with the prettier version in package-lock.json
    # (scripts/check_locks.py fails when the two differ)
    rev: v3.9.6
    hooks:
      - id: prettier

  - repo: https://github.com/crate-ci/typos
    # Keep in sync with the typos action in .github/workflows/test.yml
    # (scripts/check_locks.py fails when the two differ)
    rev: v1.50.1
    hooks:
      - id: typos
        # Default args also carry --write-changes, which must not run in a hook
        args: [--force-exclude]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # The obfuscation CI job only runs once the dates are already pushed to
      # the public repository. Needs Python 3.14 as `python`, such as the
      # project's virtual environment (see CONTRIBUTING.md).
      - id: check-obfuscation
        name: check that the KML files are obfuscated
        entry: python -m kml_heatmap.obfuscate data --check
        language: system
        files: (?i)^data/.*\.kml$
        pass_filenames: false
