---
# Install with: pip install pre-commit && pre-commit install
# Input data (data/) is excluded from the fixers; the generated site (docs/)
# is not tracked at all. Dependabot bumps the two revs below.
#
# The linters and formatters are local hooks (`repo: local`, `language: system`)
# rather than pinned mirrors, so no hook revision of their own can drift. They
# resolve from $PATH and node_modules instead, which is what CI installs only
# with the virtual environment active and `npm ci` run; see CONTRIBUTING.md.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^data/
      - id: trailing-whitespace
        exclude: ^data/
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # ruff is resolved off $PATH, so it is the requirements-test.lock
      # version CI installs as long as the virtual environment is active.
      # --force-exclude makes it honour the excludes in pyproject.toml even
      # though pre-commit passes the file names explicitly.
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # prettier is taken straight out of node_modules, so it is the version
      # package-lock.json pins and `npm run format:check` runs in CI
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --ignore-unknown
        language: system
        types: [text]

      # typos is not part of either lock file, so it is whatever is installed.
      # Like `make lint`, skip it when the binary is missing; the CI typos job
      # is the one that has to pass.
      - id: typos
        name: typos
        entry: sh -c 'command -v typos >/dev/null 2>&1 || exit 0; exec typos --force-exclude "$@"' typos
        language: system
        types: [text]

      # The obfuscation CI job only runs once the dates are already pushed to
      # the public repository. Needs Python 3.14 as `python`, such as the
      # project's virtual environment (see CONTRIBUTING.md).
      - id: check-obfuscation
        name: check that the KML files are obfuscated
        entry: python -m kml_heatmap.obfuscate data --check
        language: system
        files: (?i)^data/.*\.kml$
        pass_filenames: false
