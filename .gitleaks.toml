# Gitleaks configuration, used by the CI security job and the pre-commit hook.

# Extend the built-in rule set. Without this block gitleaks would only apply
# the rules defined in this file (none) and therefore detect nothing.
[extend]
useDefault = true

# The generated site used to be committed, and its map_config.js embeds the
# public client-side tile API keys (CARTO, OpenAIP). The file is no longer
# tracked, but gitleaks scans the history, so the old revisions still need
# the allowlist.
[[allowlists]]
description = "Historic generated site files with public tile API keys"
paths = ['''^docs/map_config\.js$''']
