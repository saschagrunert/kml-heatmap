<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://nwy-tiles-api.prod.newaydata.com https://s3.amazonaws.com/elevation-tiles-prod/ https://tiles.maps.eox.at; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Interactive flight path heatmap visualization from KML flight logs"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#141414" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="KML Heatmap" />
    <meta property="og:title" content="KML Heatmap" />
    <meta
      property="og:description"
      content="Interactive flight path heatmap visualization from KML flight logs"
    />
    <meta property="og:type" content="website" />
    <title>KML Heatmap</title>
    <!-- The style, then the tile index, glyphs and sprite; the tiles come
         from four more hosts the style only names once it has loaded.
         crossorigin because MapLibre fetches all of them. -->
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link
      rel="preconnect"
      href="https://tiles.basemaps.cartocdn.com"
      crossorigin
    />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./favicon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./favicon-512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link
      rel="apple-touch-icon-precomposed"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="./styles.css" />
    <!-- What the app asks for as soon as it runs: the chunk its bundle
         imports, MapLibre, the two index files, and the latest year, which
         is what the page shows first. Requesting them here overlaps their
         download with the bundle instead of starting it once that has run;
         the loader's fetch for the same URL is then served from the preload
         (crossorigin is what makes the two requests match). -->
    <link rel="modulepreload" href="./shared.bundle.js" />
    <link rel="modulepreload" href="./vendor/maplibre-gl.mjs" />
    <link rel="modulepreload" href="./vendor/maplibre-gl-shared.mjs" />
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="$data_dir_name/metadata.json"
    />
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="$data_dir_name/airports.json"
    />
    $year_preload
  </head>
  <body>
    <noscript>
      <p class="noscript-message">
        JavaScript is required to display the flight map visualization.
      </p>
    </noscript>
    <a href="#map" class="skip-nav">Skip to map</a>
    <div
      id="map"
      role="application"
      aria-label="Flight map visualization"
      tabindex="-1"
    ></div>
    <!-- Left control column: what the map shows you and how to pass it on.
         Icons are injected from utils/icons.ts into every [data-icon]. -->
    <div id="left-buttons" class="control-column is-at-end">
      <div
        class="control-group"
        role="group"
        aria-labelledby="view-group-title"
      >
        <h2 class="control-group-title" id="view-group-title">View</h2>
        <div class="control-row">
          <button
            id="stats-btn"
            class="btn-surface control-btn"
            data-action="toggleStats"
            data-icon="stats"
            title="Toggle flight statistics panel"
            aria-label="Toggle flight statistics panel"
            aria-controls="stats-rail"
            aria-expanded="false"
          >
            <span class="control-label">Statistics</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="wrapped-btn"
            class="btn-surface control-btn"
            data-action="showWrapped"
            data-icon="wrapped"
            title="Wrapped: your year in review"
            aria-label="Wrapped: your year in review"
          >
            <span class="control-label">Wrapped</span>
          </button>
        </div>
        <div class="control-sep" role="separator"></div>
        <div class="control-row">
          <button
            id="replay-btn"
            class="btn-surface control-btn initially-half-opacity"
            data-action="toggleReplay"
            data-icon="play"
            title="Select exactly one flight with timing data to replay"
            aria-label="Replay selected flight path"
            aria-disabled="true"
            aria-pressed="false"
          >
            <span class="control-label">Replay</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="isolate-btn"
            class="btn-surface control-btn initially-half-opacity"
            data-action="toggleIsolateSelection"
            data-icon="isolate"
            title="Isolate selected paths"
            aria-label="Isolate selected paths"
            aria-disabled="true"
            aria-pressed="false"
          >
            <span class="control-label">Isolate</span>
          </button>
        </div>
      </div>

      <div
        class="control-group"
        role="group"
        aria-labelledby="share-group-title"
      >
        <h2 class="control-group-title" id="share-group-title">Share</h2>
        <div class="control-row">
          <button
            id="share-btn"
            class="btn-surface control-btn"
            data-action="shareLink"
            data-icon="share"
            title="Copy link to this map view"
            aria-label="Copy link to this map view"
          >
            <span class="control-label">Copy link</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="export-btn"
            class="btn-surface control-btn"
            data-action="exportMap"
            data-icon="export"
            title="Export image of the map"
            aria-label="Export image of the map"
          >
            <span class="control-label">Export image</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Right control column: which flights are drawn and which layers -->
    <div id="right-buttons" class="control-column is-at-end">
      <div
        class="control-group"
        role="group"
        aria-labelledby="filter-group-title"
      >
        <h2 class="control-group-title" id="filter-group-title">Filter</h2>
        <div class="control-row">
          <div
            id="year-filter"
            class="btn-surface control-btn filter-dropdown"
            data-icon="calendar"
          >
            <select
              id="year-select"
              data-action="filterByYear"
              aria-label="Filter flights by year"
            >
              <option value="all">All years</option>
            </select>
          </div>
        </div>
        <div class="control-row">
          <div
            id="aircraft-filter"
            class="btn-surface control-btn filter-dropdown"
            data-icon="aircraft"
          >
            <select
              id="aircraft-select"
              data-action="filterByAircraft"
              aria-label="Filter flights by aircraft"
            >
              <option value="all">All aircraft</option>
            </select>
          </div>
        </div>
      </div>

      <div
        class="control-group"
        role="group"
        aria-labelledby="layers-group-title"
      >
        <h2 class="control-group-title" id="layers-group-title">Layers</h2>
        <div class="control-row">
          <button
            id="heatmap-btn"
            class="btn-surface control-btn active"
            data-action="toggleHeatmap"
            data-icon="heatmap"
            title="Toggle heatmap overlay"
            aria-label="Toggle heatmap overlay"
            aria-pressed="true"
          >
            <span class="control-label">Heatmap</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="airports-btn"
            class="btn-surface control-btn active"
            data-action="toggleAirports"
            data-icon="airport"
            title="Airports: show airport markers"
            aria-label="Airports: show airport markers"
            aria-pressed="true"
          >
            <span class="control-label">Airports</span>
          </button>
        </div>
        <div class="control-sep" role="separator"></div>
        <div class="control-row">
          <button
            id="altitude-btn"
            class="btn-surface control-btn active"
            data-action="toggleAltitude"
            data-icon="altitude"
            title="Toggle altitude color visualization"
            aria-label="Toggle altitude color visualization"
            aria-pressed="true"
          >
            <span class="control-label">Altitude</span>
          </button>
          <span class="ramp-chip ramp-chip-altitude" aria-hidden="true"></span>
        </div>
        <div class="control-row">
          <button
            id="airspeed-btn"
            class="btn-surface control-btn initially-half-opacity"
            data-action="toggleAirspeed"
            data-icon="speed"
            disabled
            title="Speed: color paths by groundspeed"
            aria-label="Speed: color paths by groundspeed"
            aria-pressed="false"
          >
            <span class="control-label">Speed</span>
          </button>
          <span class="ramp-chip ramp-chip-speed" aria-hidden="true"></span>
        </div>
        <div class="control-row">
          <button
            id="aviation-btn"
            class="btn-surface control-btn"
            data-action="toggleAviation"
            data-icon="aviation"
            title="Toggle aviation data overlay"
            aria-label="Toggle aviation data overlay"
            aria-pressed="false"
          >
            <span class="control-label">Aviation</span>
          </button>
        </div>
      </div>

      <!-- How the map itself is drawn. The map turns and tilts by gesture;
           the compass points north and is the way back (ui/mapOrientation.ts) -->
      <div class="control-group" role="group" aria-labelledby="map-group-title">
        <h2 class="control-group-title" id="map-group-title">Map</h2>
        <div class="control-row">
          <button
            id="compass-btn"
            class="btn-surface control-btn compass-btn"
            data-action="resetNorth"
            data-icon="compass"
            title="North up: turn the map back north up and flat (right drag or Ctrl drag turns and tilts it)"
            aria-label="North up: turn the map back north up and flat"
          >
            <span class="control-label">North up</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="globe-btn"
            class="btn-surface control-btn"
            data-action="toggleGlobe"
            data-icon="globe"
            title="Globe: draw the map as a globe"
            aria-label="Globe: draw the map as a globe"
            aria-pressed="false"
          >
            <span class="control-label">Globe</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="three-d-btn"
            class="btn-surface control-btn"
            data-action="toggleThreeD"
            data-icon="threeD"
            title="3D: lift the flights to their altitude, over the terrain"
            aria-label="3D: lift the flights to their altitude, over the terrain"
            aria-pressed="false"
          >
            <span class="control-label">3D</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="satellite-btn"
            class="btn-surface control-btn"
            data-action="toggleSatellite"
            data-icon="satellite"
            title="Satellite: draw the ground from satellite imagery"
            aria-label="Satellite: draw the ground from satellite imagery"
            aria-pressed="false"
          >
            <span class="control-label">Satellite</span>
          </button>
        </div>
        <div class="control-row">
          <button
            id="reset-view-btn"
            class="btn-surface control-btn"
            data-action="resetView"
            data-icon="reset"
            title="Reset view: newest year, all aircraft, heatmap and airports, north up"
            aria-label="Reset view: newest year, all aircraft, heatmap and airports, north up"
          >
            <span class="control-label">Reset view</span>
          </button>
        </div>
      </div>
    </div>

    <!-- The compass of the phone layout, where the columns are hidden. Shown
         only while the map is turned or tilted (ui/mapOrientation.ts). -->
    <button
      type="button"
      id="compass-float-btn"
      class="btn-surface compass-btn"
      data-action="resetNorth"
      data-icon="compass"
      data-icon-size="20"
      title="North up: turn the map back north up and flat"
      aria-label="North up: turn the map back north up and flat"
      hidden
    ></button>

    <!-- Statistics rail: a collapse control plus the panel the stats manager
         fills. Hidden until the statistics are opened; the map is sized
         beside the rail rather than underneath it. -->
    <div id="stats-rail" hidden>
      <div id="stats-rail-header">
        <h2 id="stats-rail-title" class="kh-stats-title">
          <span
            class="kh-stats-title-icon"
            data-icon="stats"
            data-icon-size="20"
          ></span>
          <span class="kh-stats-title-text">Flight Statistics</span>
        </h2>
        <button
          id="stats-collapse-btn"
          class="btn-surface control-btn"
          data-action="toggleStats"
          data-icon="collapse"
          data-icon-size="20"
          title="Collapse statistics"
          aria-label="Collapse statistics"
          aria-controls="stats-rail"
          aria-expanded="false"
        ></button>
      </div>
      <!-- Focusable: the panel scrolls (bottom sheet on small screens) -->
      <div
        id="stats-panel"
        role="region"
        aria-label="Flight statistics"
        tabindex="0"
      ></div>
    </div>
    <div
      id="altitude-legend"
      class="color-legend"
      hidden
      role="region"
      aria-label="Altitude color scale legend"
    >
      <div class="legend-title" data-icon="altitude">Altitude</div>
      <div
        class="gradient-bar"
        role="img"
        aria-label="Altitude gradient from low to high"
      ></div>
      <div class="labels">
        <span id="legend-min">0 ft</span>
        <span id="legend-max">10,000 ft</span>
      </div>
    </div>
    <div
      id="airspeed-legend"
      class="color-legend"
      hidden
      role="region"
      aria-label="Groundspeed color scale legend"
    >
      <div class="legend-title" data-icon="speed">Groundspeed</div>
      <div
        class="gradient-bar"
        role="img"
        aria-label="Groundspeed gradient from slow to fast"
      ></div>
      <div class="labels">
        <span id="airspeed-legend-min">0 kt</span>
        <span id="airspeed-legend-max">200 kt</span>
      </div>
    </div>

    <!-- What is selected, and the way out of it. A selection is only drawn
         on the map where the paths themselves are drawn; at the zoom levels
         that show the heat bloom alone it had no representation at all, and
         nothing anywhere said how many flights Isolate and the shared link
         would carry. Filled by ui/pathSelection.ts. -->
    <div id="selection-chip" hidden>
      <span id="selection-chip-count"></span>
      <button
        type="button"
        id="selection-clear-btn"
        class="btn-surface"
        data-icon="close"
        title="Clear the selection"
        aria-label="Clear the selection"
      >
        <span class="control-label">Clear</span>
      </button>
    </div>

    <!-- Toast announcements. Present from the start, so screen readers track
         them before utils/toast.ts writes a message into one. -->
    <div
      id="toast-status"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div
      id="toast-alert"
      class="visually-hidden"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    ></div>

    <!-- Loading indicator (shown/hidden by the data manager, text is updatable) -->
    <div id="loading">
      <div role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span id="loading-text">Loading data…</span>
      </div>
      <!-- Filled while year files of a known size download. Outside the live
           region, which would otherwise announce every step of the value -->
      <div
        id="loading-progress"
        role="progressbar"
        aria-label="Download progress"
        aria-valuemin="0"
        aria-valuemax="100"
        hidden
      ></div>
    </div>

    <!-- Replay Controls -->
    <div id="replay-controls" role="region" aria-label="Flight replay controls">
      <div id="replay-controls-inner">
        <div
          id="replay-buttons"
          role="group"
          aria-label="Replay playback controls"
        >
          <button
            id="replay-play-btn"
            class="btn-surface replay-btn"
            data-action="playReplay"
            data-icon="play"
            data-icon-size="20"
            title="Play replay"
            aria-label="Play replay"
          ></button>
          <button
            id="replay-pause-btn"
            class="btn-surface replay-btn initially-hidden"
            data-action="pauseReplay"
            data-icon="pause"
            data-icon-size="20"
            title="Pause replay"
            aria-label="Pause replay"
          ></button>
          <button
            id="replay-stop-btn"
            class="btn-surface replay-btn"
            data-action="stopReplay"
            data-icon="stop"
            data-icon-size="20"
            title="Stop replay and reset to beginning"
            aria-label="Stop replay and reset to beginning"
          ></button>
          <div id="replay-time-display">00:00 / 00:00</div>
          <select
            id="replay-speed"
            class="btn-surface replay-btn"
            data-action="changeReplaySpeed"
            aria-label="Replay speed multiplier"
          >
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
            <option value="25">25x</option>
            <option value="50" selected>50x</option>
            <option value="100">100x</option>
            <option value="200">200x</option>
            <option value="500">500x</option>
          </select>
          <button
            id="replay-autozoom-btn"
            class="btn-surface replay-btn"
            data-action="toggleAutoZoom"
            data-icon="autoZoom"
            data-icon-size="20"
            title="Auto-zoom disabled"
            aria-label="Toggle automatic zoom adjustment"
            aria-pressed="false"
          ></button>
          <!-- Bound by ReplayManager, not by a data-action -->
          <button
            id="replay-chase-btn"
            class="btn-surface replay-btn"
            data-icon="aircraft"
            data-icon-size="20"
            title="Chase view off"
            aria-label="Chase view: follow the aircraft from behind"
            aria-pressed="false"
          ></button>
        </div>
        <div id="replay-slider-container">
          <span id="replay-slider-start" aria-hidden="true">0:00</span>
          <input
            type="range"
            id="replay-slider"
            min="0"
            max="100"
            value="0"
            data-action="seekReplay"
            aria-label="Replay timeline position"
            aria-valuetext="0:00 of 0:00"
          />
          <span id="replay-slider-end" aria-hidden="true">0:00</span>
        </div>
        <!-- Announces play/pause/seek only; the time display updates every frame -->
        <div
          id="replay-live"
          class="visually-hidden"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </div>
    </div>

    <!-- Wrapped Card Modal -->
    <div
      id="wrapped-modal"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="wrapped-title"
    >
      <div id="wrapped-container">
        <div id="wrapped-header">
          <button
            class="close-btn"
            data-action="closeWrapped"
            data-icon="close"
            data-icon-size="20"
            title="Close year in review"
            aria-label="Close year in review"
          >
            <span class="control-label">Close</span>
          </button>
        </div>
        <div id="wrapped-content">
          <!-- Cards column - left side -->
          <!-- tabindex: the column scrolls, so it has to be reachable by
               keyboard (axe: scrollable-region-focusable) -->
          <div
            id="wrapped-cards-column"
            tabindex="0"
            role="region"
            aria-label="Year in review cards"
          >
            <!-- Card 1: Stats -->
            <section
              id="wrapped-card-stats"
              class="wrapped-square-card"
              aria-labelledby="wrapped-title"
            >
              <h1 id="wrapped-title">Your Year in Flight</h1>
              <p class="year" id="wrapped-year">2025</p>
              <div class="stat-grid" id="wrapped-stats"></div>
            </section>

            <!-- Card 2: Facts -->
            <section
              id="wrapped-card-facts"
              class="wrapped-square-card"
              aria-label="Fun facts"
            >
              <div class="fun-facts" id="wrapped-fun-facts"></div>
            </section>

            <!-- Card 3: Aircraft Fleet -->
            <section
              id="wrapped-card-fleet"
              class="wrapped-square-card"
              aria-label="Aircraft fleet"
            >
              <div class="aircraft-fleet" id="wrapped-aircraft-fleet"></div>
            </section>

            <!-- Card 4: Airports -->
            <section
              id="wrapped-card-airports"
              class="wrapped-square-card"
              aria-label="Airports visited"
            >
              <div class="top-airports" id="wrapped-top-airports"></div>
              <div class="airports-grid" id="wrapped-airports-grid"></div>
            </section>
          </div>

          <!-- Map - right side -->
          <div
            id="wrapped-map-container"
            role="region"
            aria-label="Flight map overview"
          >
            <!-- Map will be moved here when wrapped is shown -->
          </div>
        </div>
      </div>
    </div>

    <!-- GitHub footer -->
    <div id="github-footer">
      <a
        href="https://github.com/saschagrunert/kml-heatmap"
        target="_blank"
        rel="noopener noreferrer"
        title="View on GitHub"
        aria-label="View on GitHub"
      >
        <svg
          class="github-icon"
          viewBox="0 0 16 16"
          width="20"
          height="20"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </div>

    <!-- Deferred scripts and modules execute in document order: config,
         then the application bundle, which imports MapLibre from vendor/,
         the year worker's bundle with the first year file and html-to-image
         on the first export. All code is served
         from the site itself (vendor/ is copied out of node_modules by
         scripts/vendor.js); only the map tiles come from elsewhere. -->
    <!-- Configuration with template variables -->
    <script src="./map_config.js" defer></script>

    <!-- Main application -->
    <script type="module" src="./mapApp.bundle.js"></script>
  </body>
</html>
